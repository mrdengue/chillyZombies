<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Frost Dinosaur - Walk 02 (legs together) -->
  <rect x="9" y="2" width="4" height="1" fill="#4466AA"/>
  <rect x="8" y="3" width="6" height="2" fill="#5577BB"/>
  <rect x="8" y="5" width="5" height="1" fill="#4466AA"/>
  <rect x="11" y="3" width="2" height="1" fill="#FF6644"/>
  <rect x="12" y="3" width="1" height="1" fill="#FFCC00"/>
  <rect x="13" y="4" width="1" height="1" fill="#FFFFFF"/>
  <!-- Ice spines -->
  <rect x="6" y="3" width="1" height="1" fill="#88CCFF"/>
  <rect x="7" y="2" width="1" height="2" fill="#88CCFF"/>
  <rect x="8" y="1" width="1" height="2" fill="#AADDFF"/>
  <rect x="7" y="5" width="3" height="1" fill="#5577BB"/>
  <!-- Body (slightly lower) -->
  <rect x="3" y="6" width="8" height="1" fill="#5577BB"/>
  <rect x="2" y="7" width="9" height="1" fill="#4466AA"/>
  <rect x="2" y="8" width="9" height="1" fill="#5577BB"/>
  <rect x="3" y="9" width="8" height="1" fill="#4466AA"/>
  <rect x="3" y="10" width="7" height="1" fill="#3355AA"/>
  <rect x="4" y="9" width="4" height="1" fill="#6688CC"/>
  <rect x="4" y="10" width="3" height="1" fill="#6688CC"/>
  <!-- Tail -->
  <rect x="1" y="8" width="1" height="1" fill="#4466AA"/>
  <rect x="0" y="7" width="2" height="1" fill="#5577BB"/>
  <rect x="5" y="6" width="1" height="1" fill="#AADDFF"/>
  <!-- Legs together -->
  <rect x="5" y="11" width="2" height="2" fill="#4466AA"/>
  <rect x="8" y="11" width="2" height="2" fill="#4466AA"/>
  <rect x="5" y="13" width="2" height="1" fill="#CCDDEE"/>
  <rect x="8" y="13" width="2" height="1" fill="#CCDDEE"/>
