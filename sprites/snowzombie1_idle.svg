<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Snow Zombie 1 - Frost Walker (pale blue, icy) -->
  <!-- Ragged hood -->
  <rect x="5" y="1" width="6" height="1" fill="#556688"/>
  <rect x="5" y="2" width="7" height="1" fill="#667799"/>
  <!-- Head (pale frozen skin) -->
  <rect x="6" y="2" width="4" height="3" fill="#BBCCDD"/>
  <!-- Glowing blue eyes -->
  <rect x="7" y="3" width="1" height="1" fill="#44CCFF"/>
  <rect x="9" y="3" width="1" height="1" fill="#44CCFF"/>
  <!-- Frozen mouth -->
  <rect x="7" y="4" width="2" height="1" fill="#446688"/>
  <!-- Body (tattered winter coat) -->
  <rect x="5" y="5" width="6" height="1" fill="#556688"/>
  <rect x="5" y="6" width="6" height="1" fill="#4A5C6E"/>
  <rect x="5" y="7" width="6" height="1" fill="#556688"/>
  <rect x="5" y="8" width="6" height="1" fill="#4A5C6E"/>
  <!-- Arms (stiff, frozen) -->
  <rect x="3" y="6" width="2" height="1" fill="#BBCCDD"/>
  <rect x="11" y="6" width="2" height="1" fill="#BBCCDD"/>
  <rect x="2" y="7" width="2" height="1" fill="#AABBCC"/>
  <rect x="12" y="7" width="1" height="1" fill="#AABBCC"/>
  <!-- Ice patches on body -->
  <rect x="6" y="6" width="1" height="1" fill="#88CCEE"/>
  <rect x="10" y="8" width="1" height="1" fill="#88CCEE"/>
  <!-- Legs -->
  <rect x="6" y="9" width="2" height="2" fill="#445566"/>
  <rect x="9" y="9" width="2" height="2" fill="#445566"/>
  <rect x="6" y="11" width="2" height="1" fill="#334455"/>
  <rect x="9" y="11" width="2" height="1" fill="#334455"/>
  <!-- Frozen feet -->
  <rect x="5" y="12" width="3" height="1" fill="#88AACC"/>
  <rect x="9" y="12" width="3" height="1" fill="#88AACC"/>
</svg>
