<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Snow Zombie 3 - Frozen Soldier - Walk 01 (front legs forward) -->
  <!-- Helmet -->
  <rect x="5" y="1" width="6" height="1" fill="#556677"/>
  <rect x="5" y="2" width="6" height="1" fill="#667788"/>
  <!-- Face (pale green, frozen) -->
  <rect x="6" y="3" width="4" height="2" fill="#88AA99"/>
  <!-- Red eyes -->
  <rect x="7" y="3" width="1" height="1" fill="#FF4444"/>
  <rect x="9" y="3" width="1" height="1" fill="#FF4444"/>
  <!-- Mouth guard -->
  <rect x="6" y="5" width="4" height="1" fill="#556677"/>
  <!-- Armored body -->
  <rect x="4" y="6" width="8" height="1" fill="#667788"/>
  <rect x="4" y="7" width="8" height="1" fill="#556677"/>
  <rect x="4" y="8" width="8" height="1" fill="#667788"/>
  <rect x="5" y="9" width="6" height="1" fill="#556677"/>
  <!-- Armor plate detail -->
  <rect x="7" y="6" width="2" height="3" fill="#778899"/>
  <!-- Ice crystal growths -->
  <rect x="3" y="5" width="1" height="2" fill="#88DDFF"/>
  <rect x="12" y="5" width="1" height="2" fill="#88DDFF"/>
  <rect x="4" y="4" width="1" height="1" fill="#AAEEFF"/>
  <!-- Arms (armored) -->
  <rect x="2" y="7" width="2" height="1" fill="#88AA99"/>
  <rect x="12" y="7" width="2" height="1" fill="#88AA99"/>
  <!-- Legs - front legs forward -->
  <rect x="4" y="10" width="2" height="1" fill="#556677"/>
  <rect x="3" y="11" width="2" height="1" fill="#556677"/>
  <rect x="9" y="10" width="2" height="2" fill="#556677"/>
  <rect x="10" y="12" width="2" height="1" fill="#556677"/>
  <!-- Boots -->
  <rect x="2" y="12" width="3" height="1" fill="#445566"/>
  <rect x="10" y="13" width="3" height="1" fill="#445566"/>
</svg>