<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Ice Zombie (Zombiess) - Dead (shattered) -->
  <!-- Shattered ice pieces -->
  <rect x="1" y="8" width="2" height="1" fill="#88CCEE"/>
  <rect x="5" y="7" width="1" height="1" fill="#88CCEE"/>
  <rect x="12" y="7" width="2" height="1" fill="#88CCEE"/>
  <rect x="14" y="9" width="1" height="1" fill="#66AACC"/>
  <!-- Head on ground -->
  <rect x="2" y="9" width="3" height="2" fill="#5588AA"/>
  <!-- Dead eyes -->
  <rect x="3" y="9" width="1" height="1" fill="#224466"/>
  <rect x="4" y="9" width="1" height="1" fill="#224466"/>
  <!-- Body collapsed -->
  <rect x="5" y="9" width="6" height="3" fill="#3A5A7A"/>
  <rect x="5" y="10" width="6" height="1" fill="#335570"/>
  <!-- Arm splayed -->
  <rect x="1" y="10" width="2" height="1" fill="#5588AA"/>
  <rect x="11" y="8" width="2" height="1" fill="#5588AA"/>
  <!-- Claws -->
  <rect x="0" y="10" width="1" height="1" fill="#4477AA"/>
  <rect x="13" y="8" width="1" height="1" fill="#4477AA"/>
  <!-- Legs -->
  <rect x="11" y="9" width="3" height="2" fill="#2A3A55"/>
  <!-- Ice crystal debris -->
  <rect x="3" y="7" width="1" height="1" fill="#AADDEE"/>
  <rect x="8" y="7" width="1" height="1" fill="#AADDEE"/>
  <rect x="10" y="7" width="1" height="1" fill="#AADDEE"/>
  <!-- Ice puddle forming -->
  <rect x="3" y="12" width="10" height="1" fill="#88BBDD"/>
  <rect x="4" y="13" width="8" height="1" fill="#AADDEE"/>
</svg>
