<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss8: Death Chill - dead (collapsed, crown fallen) -->
<!-- Collapsed robe pile -->
<rect x="2" y="10" width="12" height="3" fill="#1a0a2a"/>
<rect x="3" y="9" width="8" height="1" fill="#1a0a2a"/>
<!-- Skull fallen sideways -->
<rect x="1" y="8" width="4" height="3" fill="#2a1a2a"/>
<rect x="2" y="9" width="1" height="1" fill="#9933ff" opacity="0.2"/>
<!-- Crown fallen off -->
<rect x="5" y="7" width="4" height="1" fill="#8a6aaa"/>
<rect x="5" y="7" width="1" height="1" fill="#ff2222" opacity="0.5"/>
<rect x="7" y="7" width="1" height="1" fill="#ff2222" opacity="0.5"/>
<rect x="8" y="7" width="1" height="1" fill="#aa88cc"/>
<!-- Bony hand sticking out -->
<rect x="0" y="11" width="2" height="1" fill="#cccccc"/>
<rect x="14" y="10" width="2" height="1" fill="#cccccc"/>
<!-- Robe edges -->
<rect x="2" y="13" width="12" height="1" fill="#3a1a4a"/>
<rect x="3" y="14" width="4" height="1" fill="#0a0020"/>
<rect x="9" y="14" width="4" height="1" fill="#0a0020"/>
<!-- Fading dark energy -->
<rect x="6" y="10" width="4" height="1" fill="#3a1a4a" opacity="0.4"/>
<rect x="7" y="11" width="2" height="1" fill="#5522aa" opacity="0.2"/>
</svg>
