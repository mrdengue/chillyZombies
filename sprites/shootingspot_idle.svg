<svg xmlns="http://www.w3.org/2000/svg" width="44" height="64" viewBox="0 0 11 16" shape-rendering="crispEdges">
  <!-- ShootingSpot - Christmas tree defensive position -->
  <!-- Star on top -->
  <rect x="5" y="0" width="1" height="1" fill="#FFDD00"/>
  <rect x="4" y="1" width="3" height="1" fill="#FFCC00"/>
  <!-- Tree top -->
  <rect x="4" y="2" width="3" height="1" fill="#226622"/>
  <rect x="3" y="3" width="5" height="1" fill="#338833"/>
  <rect x="3" y="4" width="5" height="1" fill="#226622"/>
  <!-- Middle section -->
  <rect x="2" y="5" width="7" height="1" fill="#338833"/>
  <rect x="2" y="6" width="7" height="1" fill="#226622"/>
  <rect x="1" y="7" width="9" height="1" fill="#338833"/>
  <!-- Lower section -->
  <rect x="1" y="8" width="9" height="1" fill="#226622"/>
  <rect x="0" y="9" width="11" height="1" fill="#338833"/>
  <rect x="0" y="10" width="11" height="1" fill="#226622"/>
  <rect x="1" y="11" width="9" height="1" fill="#115511"/>
  <!-- Ornaments -->
  <rect x="4" y="3" width="1" height="1" fill="#FF4444"/>
  <rect x="7" y="4" width="1" height="1" fill="#4444FF"/>
  <rect x="3" y="6" width="1" height="1" fill="#FFCC00"/>
  <rect x="7" y="7" width="1" height="1" fill="#FF4444"/>
  <rect x="2" y="9" width="1" height="1" fill="#4444FF"/>
  <rect x="8" y="10" width="1" height="1" fill="#FFCC00"/>
  <rect x="5" y="8" width="1" height="1" fill="#FF4444"/>
  <!-- Lights string -->
  <rect x="6" y="5" width="1" height="1" fill="#FF8800"/>
  <rect x="4" y="7" width="1" height="1" fill="#00FF00"/>
  <rect x="6" y="9" width="1" height="1" fill="#FF8800"/>
  <!-- Trunk -->
  <rect x="4" y="12" width="3" height="2" fill="#884422"/>
  <!-- Snow at base -->
  <rect x="2" y="14" width="7" height="1" fill="#DDEEFF"/>
  <rect x="3" y="15" width="5" height="1" fill="#CCDDEE"/>
</svg>
