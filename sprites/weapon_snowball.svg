<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- 8-bit Snowball weapon button -->
  <!-- Snowball -->
  <rect x="3" y="2" width="4" height="1" fill="#E8E8FF"/>
  <rect x="2" y="3" width="6" height="1" fill="#FFFFFF"/>
  <rect x="2" y="4" width="6" height="1" fill="#FFFFFF"/>
  <rect x="2" y="5" width="6" height="1" fill="#E8E8FF"/>
  <rect x="3" y="6" width="4" height="1" fill="#CCCCEE"/>
  <!-- Shine -->
  <rect x="3" y="3" width="1" height="1" fill="#FFFFFF"/>
  <rect x="4" y="2" width="1" height="1" fill="#FFFFFF"/>
  <!-- Ice crystal detail -->
  <rect x="5" y="4" width="1" height="1" fill="#88CCFF"/>
  <!-- Motion lines -->
  <rect x="0" y="3" width="1" height="1" fill="#AABBCC"/>
  <rect x="0" y="5" width="1" height="1" fill="#AABBCC"/>
  <rect x="1" y="4" width="1" height="1" fill="#AABBCC"/>
</svg>
