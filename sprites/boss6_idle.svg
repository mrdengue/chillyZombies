<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss6: Frozen Knight - armored figure in blue/silver with icy sword -->
<!-- Helmet -->
<rect x="5" y="0" width="6" height="5" fill="#a0a8b8"/>
<rect x="5" y="0" width="6" height="1" fill="#b0b8c8"/>
<!-- Helmet visor slit -->
<rect x="6" y="2" width="4" height="1" fill="#2244aa"/>
<!-- Helmet crest -->
<rect x="7" y="0" width="2" height="1" fill="#4488cc"/>
<!-- Armored body -->
<rect x="4" y="5" width="8" height="6" fill="#8090a8"/>
<rect x="3" y="6" width="1" height="4" fill="#7080a0"/>
<rect x="12" y="6" width="1" height="4" fill="#7080a0"/>
<!-- Chest plate detail -->
<rect x="6" y="6" width="4" height="3" fill="#90a0b8"/>
<rect x="7" y="6" width="2" height="1" fill="#a8b8d0"/>
<rect x="7" y="8" width="2" height="1" fill="#a8b8d0"/>
<!-- Blue ice accents -->
<rect x="5" y="5" width="1" height="1" fill="#4488cc"/>
<rect x="10" y="5" width="1" height="1" fill="#4488cc"/>
<!-- Shield arm (left) -->
<rect x="1" y="5" width="3" height="5" fill="#7080a0"/>
<rect x="0" y="6" width="2" height="4" fill="#4488cc"/>
<rect x="0" y="7" width="1" height="2" fill="#66aadd"/>
<!-- Sword arm (right) -->
<rect x="12" y="5" width="3" height="5" fill="#7080a0"/>
<!-- Icy sword -->
<rect x="14" y="1" width="1" height="9" fill="#88ccee"/>
<rect x="15" y="1" width="1" height="9" fill="#66aacc"/>
<rect x="14" y="0" width="2" height="1" fill="#aaddff"/>
<!-- Sword crossguard -->
<rect x="13" y="5" width="3" height="1" fill="#a0a8b8"/>
<!-- Armored legs -->
<rect x="5" y="11" width="2" height="3" fill="#7080a0"/>
<rect x="9" y="11" width="2" height="3" fill="#7080a0"/>
<!-- Knee guards -->
<rect x="5" y="11" width="2" height="1" fill="#90a0b8"/>
<rect x="9" y="11" width="2" height="1" fill="#90a0b8"/>
<!-- Boots -->
<rect x="4" y="14" width="3" height="1" fill="#606878"/>
<rect x="9" y="14" width="3" height="1" fill="#606878"/>
</svg>
