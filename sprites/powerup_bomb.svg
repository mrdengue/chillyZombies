<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Bomb - Classic round bomb with fuse on dark background -->
  <!-- Dark background diamond/circle shape -->
  <rect x="5" y="1" width="6" height="1" fill="#111122"/>
  <rect x="3" y="2" width="10" height="1" fill="#111122"/>
  <rect x="2" y="3" width="12" height="1" fill="#111122"/>
  <rect x="1" y="4" width="14" height="1" fill="#111122"/>
  <rect x="1" y="5" width="14" height="1" fill="#111122"/>
  <rect x="1" y="6" width="14" height="1" fill="#111122"/>
  <rect x="1" y="7" width="14" height="1" fill="#111122"/>
  <rect x="1" y="8" width="14" height="1" fill="#111122"/>
  <rect x="1" y="9" width="14" height="1" fill="#111122"/>
  <rect x="1" y="10" width="14" height="1" fill="#111122"/>
  <rect x="1" y="11" width="14" height="1" fill="#111122"/>
  <rect x="2" y="12" width="12" height="1" fill="#111122"/>
  <rect x="3" y="13" width="10" height="1" fill="#111122"/>
  <rect x="5" y="14" width="6" height="1" fill="#111122"/>
  <!-- Fuse spark -->
  <rect x="10" y="2" width="1" height="1" fill="#FFFF00"/>
  <rect x="11" y="2" width="1" height="1" fill="#FF8800"/>
  <rect x="11" y="1" width="1" height="1" fill="#FFFF00"/>
  <rect x="10" y="1" width="1" height="1" fill="#FF4400"/>
  <!-- Fuse -->
  <rect x="9" y="3" width="1" height="1" fill="#884400"/>
  <rect x="10" y="3" width="1" height="1" fill="#AA6600"/>
  <rect x="9" y="4" width="1" height="1" fill="#AA6600"/>
  <!-- Bomb body outline -->
  <rect x="5" y="5" width="6" height="1" fill="#CC00CC"/>
  <rect x="4" y="6" width="1" height="1" fill="#CC00CC"/>
  <rect x="11" y="6" width="1" height="1" fill="#CC00CC"/>
  <rect x="3" y="7" width="1" height="1" fill="#CC00CC"/>
  <rect x="12" y="7" width="1" height="1" fill="#CC00CC"/>
  <rect x="3" y="8" width="1" height="1" fill="#CC00CC"/>
  <rect x="12" y="8" width="1" height="1" fill="#CC00CC"/>
  <rect x="3" y="9" width="1" height="1" fill="#CC00CC"/>
  <rect x="12" y="9" width="1" height="1" fill="#CC00CC"/>
  <rect x="4" y="10" width="1" height="1" fill="#CC00CC"/>
  <rect x="11" y="10" width="1" height="1" fill="#CC00CC"/>
  <rect x="5" y="11" width="6" height="1" fill="#CC00CC"/>
  <!-- Bomb body fill -->
  <rect x="5" y="6" width="6" height="1" fill="#FF00FF"/>
  <rect x="4" y="7" width="8" height="1" fill="#FF00FF"/>
  <rect x="4" y="8" width="8" height="1" fill="#FF00FF"/>
  <rect x="4" y="9" width="8" height="1" fill="#FF00FF"/>
  <rect x="5" y="10" width="6" height="1" fill="#FF00FF"/>
  <!-- Bomb highlight -->
  <rect x="5" y="6" width="2" height="1" fill="#FF66FF"/>
  <rect x="5" y="7" width="1" height="1" fill="#FF66FF"/>
  <rect x="5" y="7" width="2" height="1" fill="#FF88FF"/>
  <rect x="6" y="6" width="1" height="1" fill="#FFAAFF"/>
  <!-- Bomb dark side -->
  <rect x="10" y="9" width="1" height="1" fill="#990099"/>
  <rect x="9" y="10" width="2" height="1" fill="#990099"/>
  <rect x="11" y="8" width="1" height="1" fill="#990099"/>
  <rect x="11" y="9" width="1" height="1" fill="#990099"/>
</svg>