<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Evil Snowman - Idle -->
  <!-- Top hat -->
  <rect x="6" y="0" width="4" height="1" fill="#1A1A2E"/>
  <rect x="5" y="1" width="6" height="1" fill="#1A1A2E"/>
  <rect x="6" y="2" width="4" height="2" fill="#2D2D44"/>
  <!-- Hat band -->
  <rect x="6" y="3" width="4" height="1" fill="#CC2222"/>
  <!-- Head (snow ball) -->
  <rect x="5" y="4" width="6" height="3" fill="#F0F0FF"/>
  <rect x="6" y="4" width="4" height="3" fill="#FFFFFF"/>
  <!-- Angry eyes (angled) -->
  <rect x="6" y="5" width="2" height="1" fill="#111111"/>
  <rect x="9" y="5" width="1" height="1" fill="#111111"/>
  <!-- Red glowing pupil -->
  <rect x="7" y="5" width="1" height="1" fill="#FF2222"/>
  <rect x="9" y="5" width="1" height="1" fill="#FF2222"/>
  <!-- Carrot nose (sharp, pointing right) -->
  <rect x="10" y="5" width="2" height="1" fill="#FF8833"/>
  <rect x="12" y="5" width="1" height="1" fill="#FF6611"/>
  <!-- Evil grin -->
  <rect x="6" y="6" width="1" height="1" fill="#333"/>
  <rect x="7" y="6" width="2" height="1" fill="#222"/>
  <rect x="9" y="6" width="1" height="1" fill="#333"/>
  <!-- Body (larger snow ball) -->
  <rect x="4" y="7" width="8" height="4" fill="#F0F0FF"/>
  <rect x="5" y="7" width="6" height="4" fill="#FFFFFF"/>
  <!-- Coal buttons -->
  <rect x="8" y="8" width="1" height="1" fill="#111111"/>
  <rect x="8" y="9" width="1" height="1" fill="#111111"/>
  <rect x="8" y="10" width="1" height="1" fill="#111111"/>
  <!-- Stick arms -->
  <rect x="2" y="8" width="2" height="1" fill="#5C3A1E"/>
  <rect x="1" y="7" width="1" height="1" fill="#5C3A1E"/>
  <rect x="12" y="8" width="2" height="1" fill="#5C3A1E"/>
  <rect x="14" y="7" width="1" height="1" fill="#5C3A1E"/>
  <!-- Scarf -->
  <rect x="4" y="7" width="8" height="1" fill="#CC2222"/>
  <rect x="10" y="8" width="1" height="2" fill="#CC2222"/>
  <!-- Bottom (base snow ball) -->
  <rect x="4" y="11" width="8" height="2" fill="#E8E8F0"/>
  <rect x="5" y="11" width="6" height="2" fill="#F0F0FF"/>
  <!-- Shadow on snow -->
  <rect x="3" y="13" width="10" height="1" fill="#CCCCDD"/>
</svg>
