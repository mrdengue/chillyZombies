<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Snowball - Killer snowball projectile with ice spikes -->
  <!-- Core snowball -->
  <rect x="5" y="4" width="6" height="1" fill="#EEEEFF"/>
  <rect x="4" y="5" width="8" height="1" fill="#FFFFFF"/>
  <rect x="4" y="6" width="8" height="1" fill="#DDEEFF"/>
  <rect x="4" y="7" width="8" height="1" fill="#FFFFFF"/>
  <rect x="4" y="8" width="8" height="1" fill="#EEEEFF"/>
  <rect x="5" y="9" width="6" height="1" fill="#DDEEFF"/>
  <!-- Highlight -->
  <rect x="6" y="5" width="2" height="1" fill="#FFFFFF"/>
  <!-- Shadow detail -->
  <rect x="8" y="8" width="2" height="1" fill="#BBCCDD"/>
  <!-- Ice spikes (making it "killer") -->
  <rect x="7" y="2" width="1" height="2" fill="#88CCFF"/>
  <rect x="8" y="3" width="1" height="1" fill="#AADDFF"/>
  <rect x="3" y="6" width="1" height="1" fill="#88CCFF"/>
  <rect x="12" y="7" width="1" height="1" fill="#88CCFF"/>
  <rect x="7" y="10" width="1" height="1" fill="#AADDFF"/>
  <rect x="8" y="10" width="1" height="2" fill="#88CCFF"/>
  <rect x="2" y="5" width="1" height="1" fill="#AADDFF"/>
  <rect x="13" y="6" width="1" height="1" fill="#AADDFF"/>
</svg>
