<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Ice Zombie (Zombiess) - Walk 3 (left forward) -->
  <!-- Ice spikes -->
  <rect x="5" y="0" width="1" height="1" fill="#88CCEE"/>
  <rect x="8" y="0" width="1" height="1" fill="#88CCEE"/>
  <!-- Head (tilted left) -->
  <rect x="4" y="1" width="6" height="2" fill="#5588AA"/>
  <rect x="4" y="3" width="6" height="1" fill="#4477AA"/>
  <!-- Eyes -->
  <rect x="5" y="2" width="2" height="1" fill="#44EEFF"/>
  <rect x="8" y="2" width="1" height="1" fill="#44EEFF"/>
  <!-- Mouth -->
  <rect x="5" y="3" width="3" height="1" fill="#224466"/>
  <!-- Body -->
  <rect x="3" y="4" width="10" height="1" fill="#446688"/>
  <rect x="3" y="5" width="10" height="1" fill="#3A5A7A"/>
  <rect x="3" y="6" width="10" height="1" fill="#3A5A7A"/>
  <rect x="3" y="7" width="10" height="1" fill="#335570"/>
  <rect x="3" y="8" width="10" height="1" fill="#335570"/>
  <!-- Shoulder spikes -->
  <rect x="2" y="4" width="1" height="2" fill="#88CCEE"/>
  <rect x="13" y="3" width="1" height="2" fill="#88CCEE"/>
  <!-- Arms -->
  <rect x="1" y="6" width="2" height="2" fill="#5588AA"/>
  <rect x="0" y="7" width="1" height="1" fill="#4477AA"/>
  <rect x="13" y="4" width="2" height="2" fill="#5588AA"/>
  <rect x="14" y="5" width="1" height="1" fill="#4477AA"/>
  <!-- Ice chunks -->
  <rect x="5" y="7" width="1" height="1" fill="#AADDEE"/>
  <rect x="10" y="5" width="1" height="1" fill="#AADDEE"/>
  <!-- Legs - left forward -->
  <rect x="4" y="9" width="3" height="1" fill="#2A3A55"/>
  <rect x="3" y="10" width="3" height="2" fill="#2A3A55"/>
  <rect x="9" y="9" width="3" height="2" fill="#2A3A55"/>
  <!-- Feet -->
  <rect x="3" y="12" width="4" height="1" fill="#4477AA"/>
  <rect x="9" y="11" width="4" height="1" fill="#4477AA"/>
</svg>
