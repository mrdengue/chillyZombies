<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Frost Dinosaur - Dead (collapsed) -->
  <!-- Body on ground -->
  <rect x="1" y="8" width="10" height="1" fill="#5577BB"/>
  <rect x="1" y="9" width="11" height="1" fill="#4466AA"/>
  <rect x="1" y="10" width="11" height="1" fill="#5577BB"/>
  <rect x="2" y="11" width="9" height="1" fill="#3355AA"/>
  <!-- Head fallen -->
  <rect x="10" y="7" width="4" height="1" fill="#4466AA"/>
  <rect x="10" y="8" width="5" height="2" fill="#5577BB"/>
  <rect x="10" y="10" width="4" height="1" fill="#4466AA"/>
  <!-- X eyes -->
  <rect x="12" y="8" width="1" height="1" fill="#FF4444"/>
  <rect x="14" y="8" width="1" height="1" fill="#FF4444"/>
  <!-- Ice spines broken/scattered -->
  <rect x="3" y="7" width="1" height="1" fill="#88CCFF"/>
  <rect x="5" y="7" width="1" height="1" fill="#AADDFF"/>
  <rect x="7" y="6" width="1" height="2" fill="#88CCFF"/>
  <!-- Legs stiff -->
  <rect x="3" y="6" width="2" height="2" fill="#4466AA"/>
  <rect x="8" y="6" width="2" height="2" fill="#4466AA"/>
  <!-- Ice shards on ground -->
  <rect x="2" y="12" width="1" height="1" fill="#AADDFF"/>
  <rect x="6" y="12" width="1" height="1" fill="#88CCFF"/>
  <rect x="10" y="11" width="1" height="1" fill="#AADDFF"/>
</svg>
