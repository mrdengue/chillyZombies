<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss7: Glacier Wyrm - dead (coiled up, limp) -->
<!-- Body coiled on ground -->
<rect x="2" y="9" width="12" height="3" fill="#2a8a8a"/>
<rect x="4" y="10" width="8" height="2" fill="#c0e8e8"/>
<!-- Head drooping -->
<rect x="1" y="8" width="4" height="3" fill="#2a8a8a"/>
<rect x="2" y="9" width="2" height="1" fill="#c0e8e8"/>
<!-- Closed eye -->
<rect x="2" y="8" width="1" height="1" fill="#ffdd00" opacity="0.3"/>
<!-- Tail limp -->
<rect x="12" y="11" width="3" height="1" fill="#3aa0a0"/>
<rect x="14" y="12" width="2" height="1" fill="#4ab8b8"/>
<!-- Fallen spines -->
<rect x="5" y="8" width="1" height="1" fill="#e0f0f0" opacity="0.5"/>
<rect x="8" y="8" width="1" height="1" fill="#e0f0f0" opacity="0.5"/>
<rect x="11" y="8" width="1" height="1" fill="#e0f0f0" opacity="0.5"/>
<!-- Lower coil -->
<rect x="3" y="12" width="10" height="2" fill="#2a8a8a" opacity="0.7"/>
<rect x="5" y="13" width="6" height="1" fill="#c0e8e8" opacity="0.5"/>
<rect x="4" y="14" width="8" height="1" fill="#1a7a7a"/>
</svg>
