<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss2: Snow Wraith - spectral ghostly figure, white/purple -->
<!-- Head/hood -->
<rect x="5" y="1" width="6" height="4" fill="#d8c8e8"/>
<rect x="6" y="0" width="4" height="1" fill="#c0a8d8"/>
<rect x="5" y="1" width="1" height="1" fill="#b898cc"/>
<rect x="10" y="1" width="1" height="1" fill="#b898cc"/>
<!-- Eyes (hollow glowing) -->
<rect x="6" y="2" width="2" height="1" fill="#cc66ff"/>
<rect x="9" y="2" width="1" height="1" fill="#cc66ff"/>
<!-- Spectral body (flowing, wider at bottom) -->
<rect x="4" y="5" width="8" height="3" fill="#e0d0f0"/>
<rect x="3" y="8" width="10" height="3" fill="#d8c8e8"/>
<rect x="2" y="11" width="12" height="2" fill="#c8b8d8" opacity="0.8"/>
<!-- Wispy bottom (transparent, ghostly trail) -->
<rect x="3" y="13" width="3" height="1" fill="#c0a8d8" opacity="0.6"/>
<rect x="7" y="13" width="2" height="1" fill="#d8c8e8" opacity="0.5"/>
<rect x="10" y="13" width="3" height="1" fill="#c0a8d8" opacity="0.6"/>
<rect x="4" y="14" width="2" height="1" fill="#b898cc" opacity="0.3"/>
<rect x="10" y="14" width="2" height="1" fill="#b898cc" opacity="0.3"/>
<!-- Arms (spectral, flowing) -->
<rect x="2" y="6" width="2" height="3" fill="#d8c8e8" opacity="0.9"/>
<rect x="12" y="6" width="2" height="3" fill="#d8c8e8" opacity="0.9"/>
<rect x="1" y="8" width="1" height="2" fill="#c0a8d8" opacity="0.5"/>
<rect x="14" y="8" width="1" height="2" fill="#c0a8d8" opacity="0.5"/>
<!-- Inner glow -->
<rect x="6" y="6" width="4" height="2" fill="#ece0f8"/>
<rect x="7" y="8" width="2" height="1" fill="#f0e8ff"/>
</svg>
