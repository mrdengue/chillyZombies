<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Mega Ammo - Pile of snowballs / ammo box on dark background -->
  <!-- Dark background diamond/circle shape -->
  <rect x="5" y="1" width="6" height="1" fill="#111122"/>
  <rect x="3" y="2" width="10" height="1" fill="#111122"/>
  <rect x="2" y="3" width="12" height="1" fill="#111122"/>
  <rect x="1" y="4" width="14" height="1" fill="#111122"/>
  <rect x="1" y="5" width="14" height="1" fill="#111122"/>
  <rect x="1" y="6" width="14" height="1" fill="#111122"/>
  <rect x="1" y="7" width="14" height="1" fill="#111122"/>
  <rect x="1" y="8" width="14" height="1" fill="#111122"/>
  <rect x="1" y="9" width="14" height="1" fill="#111122"/>
  <rect x="1" y="10" width="14" height="1" fill="#111122"/>
  <rect x="1" y="11" width="14" height="1" fill="#111122"/>
  <rect x="2" y="12" width="12" height="1" fill="#111122"/>
  <rect x="3" y="13" width="10" height="1" fill="#111122"/>
  <rect x="5" y="14" width="6" height="1" fill="#111122"/>
  <!-- Ammo box base -->
  <rect x="3" y="7" width="10" height="1" fill="#00CC00"/>
  <rect x="3" y="8" width="10" height="1" fill="#00CC00"/>
  <rect x="3" y="9" width="10" height="1" fill="#009900"/>
  <rect x="3" y="10" width="10" height="1" fill="#009900"/>
  <rect x="3" y="11" width="10" height="1" fill="#007700"/>
  <rect x="3" y="12" width="10" height="1" fill="#007700"/>
  <!-- Box border highlights -->
  <rect x="3" y="7" width="1" height="6" fill="#00FF00"/>
  <rect x="12" y="7" width="1" height="6" fill="#006600"/>
  <rect x="3" y="7" width="10" height="1" fill="#00FF00"/>
  <!-- Box ammo label (cross) -->
  <rect x="7" y="8" width="2" height="1" fill="#FFFFFF"/>
  <rect x="6" y="9" width="4" height="1" fill="#FFFFFF"/>
  <rect x="7" y="10" width="2" height="1" fill="#FFFFFF"/>
  <!-- Snowballs on top -->
  <rect x="4" y="5" width="2" height="2" fill="#DDFFDD"/>
  <rect x="4" y="5" width="1" height="1" fill="#FFFFFF"/>
  <rect x="7" y="4" width="2" height="2" fill="#DDFFDD"/>
  <rect x="7" y="4" width="1" height="1" fill="#FFFFFF"/>
  <rect x="10" y="5" width="2" height="2" fill="#DDFFDD"/>
  <rect x="10" y="5" width="1" height="1" fill="#FFFFFF"/>
  <!-- Top snowball -->
  <rect x="6" y="2" width="3" height="2" fill="#DDFFDD"/>
  <rect x="6" y="2" width="1" height="1" fill="#FFFFFF"/>
  <rect x="7" y="2" width="1" height="1" fill="#FFFFFF"/>
</svg>