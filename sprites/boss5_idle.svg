<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss5: Yeti King - massive white/grey furred beast with red eyes -->
<!-- Head (big, furry) -->
<rect x="4" y="0" width="8" height="5" fill="#e8e8e8"/>
<rect x="4" y="0" width="1" height="2" fill="#d0d0d0"/>
<rect x="11" y="0" width="1" height="2" fill="#d0d0d0"/>
<!-- Fur tufts on top -->
<rect x="5" y="0" width="1" height="1" fill="#f0f0f0"/>
<rect x="7" y="0" width="1" height="1" fill="#f0f0f0"/>
<rect x="10" y="0" width="1" height="1" fill="#f0f0f0"/>
<!-- Red eyes -->
<rect x="5" y="2" width="2" height="1" fill="#ff0000"/>
<rect x="9" y="2" width="2" height="1" fill="#ff0000"/>
<rect x="6" y="2" width="1" height="1" fill="#ff4444"/>
<rect x="9" y="2" width="1" height="1" fill="#ff4444"/>
<!-- Mouth/fangs -->
<rect x="6" y="4" width="4" height="1" fill="#888888"/>
<rect x="6" y="4" width="1" height="1" fill="#ffffff"/>
<rect x="9" y="4" width="1" height="1" fill="#ffffff"/>
<!-- Massive body -->
<rect x="2" y="5" width="12" height="6" fill="#e0e0e0"/>
<rect x="1" y="6" width="1" height="4" fill="#d0d0d0"/>
<rect x="14" y="6" width="1" height="4" fill="#d0d0d0"/>
<!-- Chest fur detail -->
<rect x="6" y="6" width="4" height="3" fill="#c8c8c8"/>
<rect x="7" y="6" width="2" height="1" fill="#b8b8b8"/>
<!-- Fur texture on body -->
<rect x="3" y="7" width="1" height="1" fill="#f0f0f0"/>
<rect x="12" y="7" width="1" height="1" fill="#f0f0f0"/>
<rect x="4" y="9" width="1" height="1" fill="#f0f0f0"/>
<rect x="11" y="9" width="1" height="1" fill="#f0f0f0"/>
<!-- Massive arms -->
<rect x="0" y="6" width="2" height="5" fill="#d8d8d8"/>
<rect x="14" y="6" width="2" height="5" fill="#d8d8d8"/>
<!-- Claws -->
<rect x="0" y="11" width="2" height="1" fill="#999999"/>
<rect x="14" y="11" width="2" height="1" fill="#999999"/>
<!-- Thick legs -->
<rect x="3" y="11" width="4" height="3" fill="#d0d0d0"/>
<rect x="9" y="11" width="4" height="3" fill="#d0d0d0"/>
<!-- Feet with claws -->
<rect x="2" y="14" width="5" height="1" fill="#999999"/>
<rect x="9" y="14" width="5" height="1" fill="#999999"/>
</svg>
