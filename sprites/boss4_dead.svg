<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss4: Blizzard Mage - dead (collapsed robes, broken staff) -->
<!-- Collapsed robe pile -->
<rect x="2" y="10" width="10" height="3" fill="#1a1a3a"/>
<rect x="3" y="9" width="8" height="1" fill="#2a2a5a"/>
<!-- Head fallen -->
<rect x="2" y="9" width="3" height="2" fill="#c8b8a8"/>
<rect x="3" y="9" width="1" height="1" fill="#44aaff" opacity="0.3"/>
<!-- Silver trim visible -->
<rect x="2" y="13" width="10" height="1" fill="#c0c0d0"/>
<!-- Broken staff pieces -->
<rect x="10" y="8" width="4" height="1" fill="#8a7a5a"/>
<rect x="12" y="9" width="2" height="1" fill="#8a7a5a"/>
<!-- Crystal shattered -->
<rect x="10" y="7" width="1" height="1" fill="#66ccff" opacity="0.5"/>
<rect x="12" y="8" width="1" height="1" fill="#66ccff" opacity="0.3"/>
<!-- Robe edges -->
<rect x="1" y="12" width="2" height="1" fill="#2a2a5a"/>
<rect x="12" y="11" width="2" height="1" fill="#2a2a5a"/>
<rect x="3" y="14" width="3" height="1" fill="#1a1a3a"/>
<rect x="8" y="14" width="4" height="1" fill="#1a1a3a"/>
</svg>
