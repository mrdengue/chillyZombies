<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Snow Zombie 3 - Frozen Soldier - Dead (collapsed on side) -->
  <!-- Armored body fallen on ground -->
  <rect x="1" y="8" width="9" height="1" fill="#667788"/>
  <rect x="1" y="9" width="10" height="1" fill="#556677"/>
  <rect x="1" y="10" width="10" height="1" fill="#667788"/>
  <rect x="2" y="11" width="8" height="1" fill="#556677"/>
  <!-- Armor plate detail on ground -->
  <rect x="5" y="9" width="2" height="2" fill="#778899"/>
  <!-- Head fallen to side -->
  <rect x="10" y="7" width="4" height="1" fill="#667788"/>
  <rect x="10" y="8" width="5" height="3" fill="#88AA99"/>
  <!-- Helmet on ground -->
  <rect x="10" y="7" width="5" height="1" fill="#556677"/>
  <!-- X eyes (red) -->
  <rect x="11" y="8" width="1" height="1" fill="#FF4444"/>
  <rect x="13" y="8" width="1" height="1" fill="#FF4444"/>
  <rect x="12" y="9" width="1" height="1" fill="#FF4444"/>
  <rect x="11" y="10" width="1" height="1" fill="#FF4444"/>
  <rect x="13" y="10" width="1" height="1" fill="#FF4444"/>
  <!-- Arms sticking up -->
  <rect x="3" y="6" width="1" height="2" fill="#88AA99"/>
  <rect x="7" y="6" width="1" height="2" fill="#88AA99"/>
  <!-- Legs sticking up -->
  <rect x="2" y="5" width="2" height="3" fill="#556677"/>
  <rect x="5" y="6" width="2" height="2" fill="#556677"/>
  <!-- Ice crystals shattered -->
  <rect x="1" y="7" width="1" height="1" fill="#88DDFF"/>
  <rect x="9" y="7" width="1" height="1" fill="#88DDFF"/>
  <rect x="4" y="12" width="1" height="1" fill="#AAEEFF"/>
  <rect x="8" y="12" width="1" height="1" fill="#88DDFF"/>
  <rect x="12" y="12" width="1" height="1" fill="#AAEEFF"/>
</svg>