<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Winter Adventurer - Building weapon (arms up) -->
  <!-- Fur hat -->
  <rect x="6" y="1" width="4" height="1" fill="#8B4513"/>
  <rect x="5" y="2" width="6" height="1" fill="#A0522D"/>
  <rect x="5" y="3" width="6" height="1" fill="#D2691E"/>
  <!-- Face -->
  <rect x="6" y="4" width="4" height="1" fill="#FFDAB9"/>
  <rect x="6" y="5" width="4" height="1" fill="#FFDAB9"/>
  <!-- Eyes (focused) -->
  <rect x="7" y="4" width="1" height="1" fill="#2C1810"/>
  <rect x="9" y="4" width="1" height="1" fill="#2C1810"/>
  <!-- Blue coat body -->
  <rect x="5" y="6" width="6" height="1" fill="#2266AA"/>
  <rect x="5" y="7" width="6" height="1" fill="#2266AA"/>
  <rect x="5" y="8" width="6" height="1" fill="#1A5599"/>
  <rect x="5" y="9" width="6" height="1" fill="#1A5599"/>
  <!-- Arms raised building -->
  <rect x="3" y="5" width="2" height="1" fill="#2266AA"/>
  <rect x="11" y="5" width="2" height="1" fill="#2266AA"/>
  <rect x="3" y="4" width="1" height="1" fill="#2266AA"/>
  <rect x="12" y="4" width="1" height="1" fill="#2266AA"/>
  <!-- Gloves holding tool -->
  <rect x="3" y="3" width="1" height="1" fill="#8B4513"/>
  <rect x="12" y="3" width="1" height="1" fill="#8B4513"/>
  <!-- Snowball being built (between hands) -->
  <rect x="6" y="2" width="4" height="2" fill="#FFFFFF"/>
  <rect x="7" y="1" width="2" height="1" fill="#E8F0FF"/>
  <!-- Sparkle/crafting effect -->
  <rect x="5" y="1" width="1" height="1" fill="#FFD700"/>
  <rect x="10" y="1" width="1" height="1" fill="#FFD700"/>
  <!-- Belt -->
  <rect x="5" y="10" width="6" height="1" fill="#4A3728"/>
  <!-- Legs -->
  <rect x="6" y="11" width="2" height="2" fill="#334455"/>
  <rect x="9" y="11" width="2" height="2" fill="#334455"/>
  <!-- Boots -->
  <rect x="5" y="13" width="3" height="1" fill="#5C3A1E"/>
  <rect x="9" y="13" width="3" height="1" fill="#5C3A1E"/>
  <rect x="5" y="14" width="3" height="1" fill="#4A2F18"/>
  <rect x="9" y="14" width="3" height="1" fill="#4A2F18"/>
</svg>
