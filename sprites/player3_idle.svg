<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Snow Mage (Player3) - Idle -->
  <!-- Pointy wizard hat -->
  <rect x="8" y="0" width="1" height="1" fill="#6622AA"/>
  <rect x="7" y="1" width="3" height="1" fill="#7733BB"/>
  <rect x="6" y="2" width="4" height="1" fill="#8844CC"/>
  <rect x="5" y="3" width="6" height="1" fill="#9955DD"/>
  <!-- Star on hat -->
  <rect x="8" y="1" width="1" height="1" fill="#FFD700"/>
  <!-- Face -->
  <rect x="6" y="4" width="4" height="1" fill="#FFDAB9"/>
  <rect x="6" y="5" width="4" height="1" fill="#FFDAB9"/>
  <!-- Eyes -->
  <rect x="7" y="4" width="1" height="1" fill="#4422AA"/>
  <rect x="9" y="4" width="1" height="1" fill="#4422AA"/>
  <!-- Purple robe body -->
  <rect x="5" y="6" width="6" height="1" fill="#7733BB"/>
  <rect x="4" y="7" width="8" height="1" fill="#6622AA"/>
  <rect x="4" y="8" width="8" height="1" fill="#5511AA"/>
  <rect x="4" y="9" width="8" height="1" fill="#5511AA"/>
  <rect x="4" y="10" width="8" height="1" fill="#4400AA"/>
  <!-- Magic rune on robe -->
  <rect x="7" y="7" width="2" height="1" fill="#44CCFF"/>
  <rect x="8" y="8" width="1" height="1" fill="#44CCFF"/>
  <!-- Staff in right hand -->
  <rect x="12" y="2" width="1" height="8" fill="#8B6914"/>
  <!-- Staff crystal top -->
  <rect x="12" y="1" width="1" height="1" fill="#44EEFF"/>
  <rect x="11" y="1" width="1" height="1" fill="#88CCFF"/>
  <rect x="13" y="1" width="1" height="1" fill="#88CCFF"/>
  <!-- Left arm -->
  <rect x="3" y="7" width="1" height="2" fill="#7733BB"/>
  <rect x="3" y="9" width="1" height="1" fill="#FFDAB9"/>
  <!-- Robe bottom (flows out) -->
  <rect x="3" y="11" width="10" height="1" fill="#4400AA"/>
  <rect x="4" y="12" width="8" height="1" fill="#330088"/>
  <!-- Boots peeking out -->
  <rect x="5" y="13" width="2" height="1" fill="#5C3A1E"/>
  <rect x="9" y="13" width="2" height="1" fill="#5C3A1E"/>
</svg>
