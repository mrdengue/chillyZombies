<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" shape-rendering="crispEdges">
  <!-- Snow cap -->
  <rect x="1" y="0" width="18" height="1" fill="#ffffff"/>
  <rect x="0" y="1" width="20" height="1" fill="#e8f0f8"/>
  <rect x="0" y="2" width="20" height="1" fill="#d0e4f0"/>
  <rect x="2" y="0" width="2" height="1" fill="#f0f8ff"/>
  <rect x="8" y="0" width="3" height="1" fill="#f0f8ff"/>
  <rect x="15" y="0" width="3" height="1" fill="#f0f8ff"/>
  <!-- Snow drips -->
  <rect x="0" y="3" width="1" height="1" fill="#d0e4f0"/>
  <rect x="19" y="3" width="1" height="1" fill="#c8dce8"/>
  <!-- Stone body -->
  <rect x="0" y="3" width="20" height="15" fill="#5a5a6e"/>
  <rect x="1" y="3" width="18" height="1" fill="#6e6e82"/>
  <!-- Lighter stone texture -->
  <rect x="2" y="5" width="3" height="2" fill="#686880"/>
  <rect x="8" y="4" width="4" height="2" fill="#686880"/>
  <rect x="14" y="6" width="3" height="2" fill="#686880"/>
  <rect x="4" y="9" width="4" height="2" fill="#686880"/>
  <rect x="11" y="10" width="3" height="2" fill="#686880"/>
  <rect x="1" y="13" width="2" height="2" fill="#686880"/>
  <rect x="15" y="13" width="3" height="2" fill="#686880"/>
  <!-- Cracks/shadows -->
  <rect x="6" y="6" width="1" height="3" fill="#484858"/>
  <rect x="13" y="4" width="1" height="2" fill="#484858"/>
  <rect x="3" y="11" width="5" height="1" fill="#484858"/>
  <rect x="10" y="8" width="1" height="3" fill="#484858"/>
  <rect x="16" y="10" width="1" height="2" fill="#484858"/>
  <rect x="1" y="7" width="1" height="2" fill="#484858"/>
  <!-- Mortar lines -->
  <rect x="0" y="9" width="9" height="1" fill="#4a4a5a"/>
  <rect x="11" y="9" width="9" height="1" fill="#4a4a5a"/>
  <rect x="9" y="3" width="1" height="7" fill="#4a4a5a"/>
  <rect x="5" y="9" width="1" height="9" fill="#4a4a5a"/>
  <rect x="14" y="9" width="1" height="9" fill="#4a4a5a"/>
  <!-- Bottom -->
  <rect x="0" y="17" width="20" height="1" fill="#3e3e50"/>
  <rect x="0" y="18" width="20" height="2" fill="#2e2e40"/>
  <!-- Side edges -->
  <rect x="0" y="3" width="1" height="15" fill="#4e4e62"/>
  <rect x="19" y="3" width="1" height="15" fill="#4e4e62"/>
  <!-- Snow highlights -->
  <rect x="3" y="1" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="1" width="1" height="1" fill="#ffffff"/>
  <rect x="16" y="1" width="1" height="1" fill="#ffffff"/>
</svg>
