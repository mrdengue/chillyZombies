<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- 8-bit Fire Gift weapon button -->
  <!-- Gift box -->
  <rect x="2" y="4" width="6" height="4" fill="#DD2222"/>
  <rect x="2" y="5" width="6" height="1" fill="#CC1111"/>
  <!-- Ribbon vertical -->
  <rect x="5" y="4" width="1" height="4" fill="#FFD700"/>
  <!-- Ribbon horizontal -->
  <rect x="2" y="5" width="6" height="1" fill="#FFD700"/>
  <!-- Bow on top -->
  <rect x="3" y="3" width="1" height="1" fill="#FFD700"/>
  <rect x="6" y="3" width="1" height="1" fill="#FFD700"/>
  <rect x="4" y="2" width="2" height="2" fill="#FFEE00"/>
  <!-- Flames/sparkle -->
  <rect x="1" y="2" width="1" height="1" fill="#FF8800"/>
  <rect x="8" y="2" width="1" height="1" fill="#FF8800"/>
  <rect x="2" y="1" width="1" height="1" fill="#FFCC00"/>
  <rect x="7" y="1" width="1" height="1" fill="#FFCC00"/>
  <rect x="5" y="0" width="1" height="1" fill="#FF6600"/>
</svg>
