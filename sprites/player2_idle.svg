<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Ice Warrior (Player2) - Idle -->
  <!-- Helmet -->
  <rect x="6" y="1" width="4" height="1" fill="#AABBCC"/>
  <rect x="5" y="2" width="6" height="1" fill="#8899AA"/>
  <rect x="5" y="3" width="6" height="1" fill="#AABBCC"/>
  <!-- Helmet visor/opening -->
  <rect x="7" y="2" width="2" height="1" fill="#334455"/>
  <!-- Face in visor -->
  <rect x="6" y="3" width="4" height="1" fill="#FFDAB9"/>
  <!-- Eyes -->
  <rect x="7" y="3" width="1" height="1" fill="#2C1810"/>
  <rect x="9" y="3" width="1" height="1" fill="#2C1810"/>
  <!-- White armor body -->
  <rect x="5" y="4" width="6" height="1" fill="#CCDDEE"/>
  <rect x="4" y="5" width="8" height="1" fill="#BBCCDD"/>
  <rect x="4" y="6" width="8" height="1" fill="#AABBCC"/>
  <rect x="4" y="7" width="8" height="1" fill="#99AABB"/>
  <rect x="5" y="8" width="6" height="1" fill="#99AABB"/>
  <!-- Ice crystal emblem on chest -->
  <rect x="7" y="5" width="2" height="1" fill="#44CCFF"/>
  <rect x="8" y="6" width="1" height="1" fill="#44CCFF"/>
  <!-- Armor shoulder pads -->
  <rect x="3" y="5" width="1" height="2" fill="#CCDDEE"/>
  <rect x="12" y="5" width="1" height="2" fill="#CCDDEE"/>
  <!-- Armored arms -->
  <rect x="3" y="7" width="1" height="1" fill="#AABBCC"/>
  <rect x="12" y="7" width="1" height="1" fill="#AABBCC"/>
  <!-- Gauntlets -->
  <rect x="3" y="8" width="1" height="1" fill="#8899AA"/>
  <rect x="12" y="8" width="1" height="1" fill="#8899AA"/>
  <!-- Belt with ice buckle -->
  <rect x="5" y="9" width="6" height="1" fill="#556677"/>
  <rect x="7" y="9" width="2" height="1" fill="#44CCFF"/>
  <!-- Armored legs -->
  <rect x="6" y="10" width="2" height="2" fill="#8899AA"/>
  <rect x="9" y="10" width="2" height="2" fill="#8899AA"/>
  <!-- Boots -->
  <rect x="5" y="12" width="3" height="1" fill="#667788"/>
  <rect x="9" y="12" width="3" height="1" fill="#667788"/>
  <rect x="5" y="13" width="3" height="1" fill="#556677"/>
  <rect x="9" y="13" width="3" height="1" fill="#556677"/>
</svg>
