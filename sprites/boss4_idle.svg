<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss4: Blizzard Mage - robed figure with staff -->
<!-- Hat/hood pointed -->
<rect x="7" y="0" width="2" height="1" fill="#1a1a3a"/>
<rect x="6" y="1" width="4" height="1" fill="#2a2a5a"/>
<rect x="5" y="2" width="6" height="2" fill="#2a2a5a"/>
<!-- Face -->
<rect x="6" y="3" width="4" height="2" fill="#c8b8a8"/>
<!-- Eyes (glowing blue) -->
<rect x="7" y="3" width="1" height="1" fill="#44aaff"/>
<rect x="9" y="3" width="1" height="1" fill="#44aaff"/>
<!-- Robed body (flowing) -->
<rect x="4" y="5" width="8" height="3" fill="#2a2a5a"/>
<rect x="3" y="8" width="10" height="3" fill="#1a1a3a"/>
<rect x="2" y="11" width="12" height="2" fill="#1a1a3a"/>
<!-- Silver trim -->
<rect x="4" y="5" width="1" height="1" fill="#c0c0d0"/>
<rect x="11" y="5" width="1" height="1" fill="#c0c0d0"/>
<rect x="3" y="8" width="1" height="1" fill="#c0c0d0"/>
<rect x="12" y="8" width="1" height="1" fill="#c0c0d0"/>
<rect x="2" y="13" width="12" height="1" fill="#c0c0d0"/>
<!-- Belt/sash -->
<rect x="5" y="7" width="6" height="1" fill="#8888c0"/>
<!-- Staff (right side) -->
<rect x="13" y="1" width="1" height="12" fill="#8a7a5a"/>
<rect x="14" y="1" width="1" height="12" fill="#7a6a4a"/>
<!-- Staff crystal top -->
<rect x="12" y="0" width="3" height="2" fill="#66ccff"/>
<rect x="13" y="0" width="1" height="1" fill="#aaeeff"/>
<!-- Left arm -->
<rect x="2" y="6" width="2" height="3" fill="#2a2a5a"/>
<!-- Robe bottom -->
<rect x="3" y="14" width="4" height="1" fill="#1a1a3a"/>
<rect x="9" y="14" width="4" height="1" fill="#1a1a3a"/>
</svg>
