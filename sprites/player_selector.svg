  <rect x="12" y="6" width="3" height="1" fill="#FFDD00"/>
  <rect x="14" y="6" width="1" height="3" fill="#FFDD00"/>
  <rect x="1" y="13" width="3" height="1" fill="#FFDD00"/>
  <rect x="1" y="11" width="1" height="3" fill="#FFDD00"/>
