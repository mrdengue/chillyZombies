<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" shape-rendering="crispEdges">
  <!-- Translucent blue ice block -->
  <!-- Outer border -->
  <rect x="0" y="0" width="20" height="20" fill="#4090c0"/>
  <!-- Main ice body -->
  <rect x="1" y="1" width="18" height="18" fill="#60b8e8"/>
  <!-- Inner lighter area -->
  <rect x="2" y="2" width="16" height="16" fill="#78cef8"/>
  <!-- Bright highlight (top-left) -->
  <rect x="2" y="2" width="6" height="1" fill="#a0e8ff"/>
  <rect x="2" y="3" width="4" height="1" fill="#a0e8ff"/>
  <rect x="2" y="4" width="2" height="1" fill="#a0e8ff"/>
  <rect x="2" y="2" width="1" height="4" fill="#a0e8ff"/>
  <rect x="3" y="2" width="1" height="2" fill="#b8f0ff"/>
  <!-- Top highlight sparkle -->
  <rect x="4" y="2" width="1" height="1" fill="#d0f8ff"/>
  <rect x="3" y="3" width="1" height="1" fill="#d0f8ff"/>
  <!-- Center ice texture - lighter veins -->
  <rect x="5" y="6" width="4" height="1" fill="#90daf0"/>
  <rect x="11" y="4" width="3" height="1" fill="#90daf0"/>
  <rect x="8" y="10" width="5" height="1" fill="#90daf0"/>
  <rect x="3" y="13" width="3" height="1" fill="#90daf0"/>
  <rect x="13" y="12" width="4" height="1" fill="#90daf0"/>
  <rect x="6" y="15" width="6" height="1" fill="#90daf0"/>
  <!-- Diagonal crack lines -->
  <rect x="10" y="5" width="1" height="1" fill="#88d0e8"/>
  <rect x="11" y="6" width="1" height="1" fill="#88d0e8"/>
  <rect x="12" y="7" width="1" height="1" fill="#88d0e8"/>
  <rect x="13" y="8" width="1" height="1" fill="#88d0e8"/>
  <rect x="4" y="8" width="1" height="1" fill="#88d0e8"/>
  <rect x="5" y="9" width="1" height="1" fill="#88d0e8"/>
  <rect x="6" y="10" width="1" height="1" fill="#88d0e8"/>
  <!-- Darker blue shadows (bottom-right) -->
  <rect x="15" y="15" width="3" height="3" fill="#58a8d0"/>
  <rect x="16" y="14" width="2" height="1" fill="#58a8d0"/>
  <rect x="14" y="16" width="1" height="2" fill="#58a8d0"/>
  <!-- Bottom edge darker -->
  <rect x="1" y="18" width="18" height="1" fill="#4898c0"/>
  <!-- Right edge darker -->
  <rect x="18" y="1" width="1" height="18" fill="#4898c0"/>
  <!-- Sparkle dots -->
  <rect x="7" y="4" width="1" height="1" fill="#c0f0ff"/>
  <rect x="14" y="9" width="1" height="1" fill="#c0f0ff"/>
  <rect x="4" y="14" width="1" height="1" fill="#c0f0ff"/>
  <rect x="12" y="16" width="1" height="1" fill="#c0f0ff"/>
</svg>
