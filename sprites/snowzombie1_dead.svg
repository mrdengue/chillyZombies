<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Snow Zombie 1 - Frost Walker - Dead (collapsed on side) -->
  <!-- Body fallen on ground -->
  <rect x="1" y="8" width="8" height="1" fill="#556688"/>
  <rect x="1" y="9" width="9" height="1" fill="#4A5C6E"/>
  <rect x="1" y="10" width="9" height="1" fill="#556688"/>
  <rect x="2" y="11" width="8" height="1" fill="#4A5C6E"/>
  <!-- Head fallen to side -->
  <rect x="9" y="7" width="4" height="1" fill="#556688"/>
  <rect x="9" y="8" width="5" height="3" fill="#BBCCDD"/>
  <!-- X eyes (red) -->
  <rect x="10" y="8" width="1" height="1" fill="#FF4444"/>
  <rect x="12" y="8" width="1" height="1" fill="#FF4444"/>
  <rect x="11" y="9" width="1" height="1" fill="#FF4444"/>
  <rect x="10" y="10" width="1" height="1" fill="#FF4444"/>
  <rect x="12" y="10" width="1" height="1" fill="#FF4444"/>
  <!-- Hood fallen -->
  <rect x="9" y="7" width="5" height="1" fill="#667799"/>
  <!-- Arms sticking up -->
  <rect x="3" y="6" width="1" height="2" fill="#BBCCDD"/>
  <rect x="7" y="6" width="1" height="2" fill="#AABBCC"/>
  <!-- Legs sticking up -->
  <rect x="2" y="6" width="2" height="2" fill="#445566"/>
  <rect x="5" y="6" width="2" height="2" fill="#445566"/>
  <!-- Ice patches scattered -->
  <rect x="4" y="9" width="1" height="1" fill="#88CCEE"/>
  <rect x="8" y="11" width="1" height="1" fill="#88CCEE"/>
  <!-- Ice shards on ground -->
  <rect x="1" y="12" width="1" height="1" fill="#88CCEE"/>
  <rect x="6" y="12" width="1" height="1" fill="#88CCEE"/>
  <rect x="11" y="12" width="1" height="1" fill="#88CCEE"/>
</svg>