<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss1: Ice Golem - idle pose -->
<!-- Head -->
<rect x="5" y="1" width="6" height="5" fill="#8ecae6"/>
<rect x="5" y="1" width="6" height="1" fill="#a8daef"/>
<rect x="6" y="2" width="1" height="1" fill="#00ffff"/>
<rect x="9" y="2" width="1" height="1" fill="#00ffff"/>
<rect x="6" y="2" width="1" height="1" fill="#00ffff" opacity="0.8"/>
<rect x="9" y="2" width="1" height="1" fill="#00ffff" opacity="0.8"/>
<!-- Glowing eye aura -->
<rect x="5" y="2" width="1" height="1" fill="#00ccff" opacity="0.4"/>
<rect x="10" y="2" width="1" height="1" fill="#00ccff" opacity="0.4"/>
<!-- Mouth -->
<rect x="7" y="4" width="2" height="1" fill="#5aa0c0"/>
<!-- Body (large, bulky) -->
<rect x="4" y="6" width="8" height="5" fill="#8ecae6"/>
<rect x="3" y="7" width="1" height="3" fill="#78b8d6"/>
<rect x="12" y="7" width="1" height="3" fill="#78b8d6"/>
<!-- Ice crystal details on body -->
<rect x="6" y="7" width="1" height="1" fill="#c8e8f8"/>
<rect x="9" y="8" width="1" height="1" fill="#c8e8f8"/>
<rect x="7" y="9" width="2" height="1" fill="#a8d8f0"/>
<!-- Arms (thick) -->
<rect x="2" y="7" width="2" height="4" fill="#78b8d6"/>
<rect x="12" y="7" width="2" height="4" fill="#78b8d6"/>
<!-- Fists -->
<rect x="2" y="11" width="2" height="1" fill="#6aaccc"/>
<rect x="12" y="11" width="2" height="1" fill="#6aaccc"/>
<!-- Legs -->
<rect x="5" y="11" width="2" height="3" fill="#78b8d6"/>
<rect x="9" y="11" width="2" height="3" fill="#78b8d6"/>
<!-- Feet -->
<rect x="4" y="14" width="3" height="1" fill="#6aaccc"/>
<rect x="9" y="14" width="3" height="1" fill="#6aaccc"/>
<!-- Ice shoulder spikes -->
<rect x="3" y="5" width="2" height="2" fill="#b8e0f4"/>
<rect x="11" y="5" width="2" height="2" fill="#b8e0f4"/>
<rect x="4" y="4" width="1" height="1" fill="#c8f0ff"/>
<rect x="11" y="4" width="1" height="1" fill="#c8f0ff"/>
</svg>
