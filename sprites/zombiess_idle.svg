<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Ice Zombie (Zombiess) - Idle - Bigger, bulkier, ice crystals -->
  <!-- Ice crown/spikes on head -->
  <rect x="5" y="0" width="1" height="1" fill="#88CCEE"/>
  <rect x="8" y="0" width="1" height="1" fill="#88CCEE"/>
  <rect x="10" y="0" width="1" height="1" fill="#88CCEE"/>
  <!-- Head (icy blue skin) -->
  <rect x="5" y="1" width="6" height="2" fill="#5588AA"/>
  <rect x="5" y="3" width="6" height="1" fill="#4477AA"/>
  <!-- Glowing ice eyes -->
  <rect x="6" y="2" width="2" height="1" fill="#44EEFF"/>
  <rect x="9" y="2" width="2" height="1" fill="#44EEFF"/>
  <!-- Frozen mouth -->
  <rect x="7" y="3" width="3" height="1" fill="#224466"/>
  <!-- Ice fangs -->
  <rect x="7" y="4" width="1" height="1" fill="#CCDDEE"/>
  <rect x="9" y="4" width="1" height="1" fill="#CCDDEE"/>
  <!-- Massive body (wider than normal zombie) -->
  <rect x="3" y="4" width="10" height="1" fill="#446688"/>
  <rect x="3" y="5" width="10" height="1" fill="#3A5A7A"/>
  <rect x="3" y="6" width="10" height="1" fill="#3A5A7A"/>
  <rect x="3" y="7" width="10" height="1" fill="#335570"/>
  <rect x="3" y="8" width="10" height="1" fill="#335570"/>
  <!-- Ice crystal shoulder spikes -->
  <rect x="2" y="3" width="1" height="2" fill="#88CCEE"/>
  <rect x="13" y="3" width="1" height="2" fill="#88CCEE"/>
  <rect x="1" y="4" width="1" height="1" fill="#66AACC"/>
  <rect x="14" y="4" width="1" height="1" fill="#66AACC"/>
  <!-- Massive arms -->
  <rect x="1" y="5" width="2" height="2" fill="#5588AA"/>
  <rect x="13" y="5" width="2" height="2" fill="#5588AA"/>
  <!-- Claws -->
  <rect x="0" y="7" width="2" height="1" fill="#4477AA"/>
  <rect x="14" y="7" width="2" height="1" fill="#4477AA"/>
  <!-- Ice chunks on body -->
  <rect x="5" y="5" width="1" height="1" fill="#AADDEE"/>
  <rect x="10" y="6" width="1" height="1" fill="#AADDEE"/>
  <rect x="7" y="7" width="1" height="1" fill="#AADDEE"/>
  <!-- Tattered frozen pants -->
  <rect x="4" y="9" width="3" height="2" fill="#2A3A55"/>
  <rect x="9" y="9" width="3" height="2" fill="#2A3A55"/>
  <rect x="4" y="11" width="3" height="1" fill="#223344"/>
  <rect x="9" y="11" width="3" height="1" fill="#223344"/>
  <!-- Frozen feet -->
  <rect x="3" y="12" width="4" height="1" fill="#4477AA"/>
  <rect x="9" y="12" width="4" height="1" fill="#4477AA"/>
  <rect x="3" y="13" width="4" height="1" fill="#3A6699"/>
  <rect x="9" y="13" width="4" height="1" fill="#3A6699"/>
</svg>
