<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
<!-- Boss8: Death Chill - skeletal figure in black/dark purple with crown (FINAL BOSS) -->
<!-- Crown -->
<rect x="4" y="0" width="8" height="2" fill="#8a6aaa"/>
<rect x="4" y="0" width="1" height="1" fill="#aa88cc"/>
<rect x="6" y="0" width="1" height="1" fill="#aa88cc"/>
<rect x="9" y="0" width="1" height="1" fill="#aa88cc"/>
<rect x="11" y="0" width="1" height="1" fill="#aa88cc"/>
<!-- Crown gems -->
<rect x="5" y="0" width="1" height="1" fill="#ff2222"/>
<rect x="7" y="0" width="2" height="1" fill="#ff2222"/>
<rect x="10" y="0" width="1" height="1" fill="#ff2222"/>
<!-- Skull head -->
<rect x="5" y="2" width="6" height="4" fill="#2a1a2a"/>
<rect x="5" y="2" width="6" height="1" fill="#3a2a3a"/>
<!-- Eye sockets (glowing purple) -->
<rect x="6" y="3" width="2" height="1" fill="#9933ff"/>
<rect x="9" y="3" width="1" height="1" fill="#9933ff"/>
<!-- Nose hole -->
<rect x="7" y="4" width="2" height="1" fill="#1a0a1a"/>
<!-- Jaw/teeth -->
<rect x="6" y="5" width="4" height="1" fill="#1a0a1a"/>
<rect x="6" y="5" width="1" height="1" fill="#cccccc"/>
<rect x="7" y="5" width="1" height="1" fill="#1a0a1a"/>
<rect x="8" y="5" width="1" height="1" fill="#cccccc"/>
<rect x="9" y="5" width="1" height="1" fill="#1a0a1a"/>
<!-- Robed body -->
<rect x="3" y="6" width="10" height="5" fill="#1a0a2a"/>
<rect x="2" y="7" width="1" height="3" fill="#0a0020"/>
<rect x="13" y="7" width="1" height="3" fill="#0a0020"/>
<!-- Dark purple energy on chest -->
<rect x="6" y="7" width="4" height="2" fill="#3a1a4a"/>
<rect x="7" y="7" width="2" height="1" fill="#6633aa"/>
<rect x="7" y="8" width="2" height="1" fill="#5522aa"/>
<!-- Skeletal arms -->
<rect x="0" y="7" width="2" height="4" fill="#2a1a2a"/>
<rect x="14" y="7" width="2" height="4" fill="#2a1a2a"/>
<!-- Bony hands -->
<rect x="0" y="11" width="2" height="1" fill="#cccccc"/>
<rect x="14" y="11" width="2" height="1" fill="#cccccc"/>
<!-- Robe bottom -->
<rect x="2" y="11" width="12" height="2" fill="#1a0a2a"/>
<rect x="2" y="13" width="12" height="1" fill="#3a1a4a"/>
<!-- Robe edges -->
<rect x="3" y="14" width="4" height="1" fill="#0a0020"/>
<rect x="9" y="14" width="4" height="1" fill="#0a0020"/>
<!-- Dark aura -->
<rect x="1" y="6" width="1" height="2" fill="#3a1a4a" opacity="0.5"/>
<rect x="14" y="6" width="1" height="2" fill="#3a1a4a" opacity="0.5"/>
</svg>
