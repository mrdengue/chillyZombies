  <rect x="12" y="2" width="1" height="1" fill="#FFFFFF"/>
  <rect x="11" y="2" width="1" height="1" fill="#CCCCCC"/>
  <rect x="11" y="3" width="1" height="1" fill="#FFFFFF"/>
  <rect x="10" y="3" width="1" height="1" fill="#CCCCCC"/>
  <rect x="10" y="4" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="4" width="1" height="1" fill="#CCCCCC"/>
  <rect x="9" y="5" width="1" height="1" fill="#FFFFFF"/>
  <rect x="8" y="5" width="1" height="1" fill="#CCCCCC"/>
  <rect x="8" y="6" width="1" height="1" fill="#FF0000"/>
  <rect x="7" y="7" width="1" height="1" fill="#FF0000"/>
  <rect x="7" y="8" width="1" height="1" fill="#CC0000"/>
  <rect x="6" y="9" width="1" height="1" fill="#CC0000"/>
  <!-- Sword 2 handle -->
  <rect x="6" y="10" width="1" height="1" fill="#884400"/>
  <rect x="5" y="10" width="1" height="1" fill="#FF0000"/>
  <rect x="7" y="10" width="1" height="1" fill="#FF0000"/>
  <rect x="5" y="11" width="1" height="1" fill="#884400"/>
  <rect x="4" y="12" width="1" height="1" fill="#884400"/>
  <!-- Center cross glow -->
  <rect x="7" y="7" width="2" height="2" fill="#FF4444"/>
  <rect x="7" y="6" width="2" height="1" fill="#FF0000"/>
  <rect x="7" y="9" width="2" height="1" fill="#CC0000"/>
