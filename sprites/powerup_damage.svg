  <rect x="4" y="3" width="1" height="1" fill="#CCCCCC"/>
  <rect x="5" y="3" width="1" height="1" fill="#FFFFFF"/>
  <rect x="5" y="4" width="1" height="1" fill="#CCCCCC"/>
  <rect x="6" y="4" width="1" height="1" fill="#FFFFFF"/>
  <rect x="6" y="5" width="1" height="1" fill="#CCCCCC"/>
  <rect x="7" y="5" width="1" height="1" fill="#FFFFFF"/>
  <rect x="7" y="6" width="1" height="1" fill="#FF0000"/>
  <rect x="8" y="7" width="1" height="1" fill="#FF0000"/>
  <rect x="8" y="8" width="1" height="1" fill="#CC0000"/>
  <rect x="9" y="9" width="1" height="1" fill="#CC0000"/>
  <!-- Sword 1 handle -->
  <rect x="9" y="10" width="1" height="1" fill="#884400"/>
  <rect x="10" y="10" width="1" height="1" fill="#FF0000"/>
  <rect x="8" y="10" width="1" height="1" fill="#FF0000"/>
  <rect x="10" y="11" width="1" height="1" fill="#884400"/>
