<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Evil Snowman - Walk 1 (tilting right, bouncing) -->
  <!-- Top hat (tilted) -->
  <rect x="7" y="0" width="4" height="1" fill="#1A1A2E"/>
  <rect x="6" y="1" width="6" height="1" fill="#1A1A2E"/>
  <rect x="7" y="2" width="4" height="2" fill="#2D2D44"/>
  <rect x="7" y="3" width="4" height="1" fill="#CC2222"/>
  <!-- Head -->
  <rect x="6" y="4" width="6" height="3" fill="#F0F0FF"/>
  <rect x="7" y="4" width="4" height="3" fill="#FFFFFF"/>
  <!-- Angry eyes -->
  <rect x="7" y="5" width="2" height="1" fill="#111111"/>
  <rect x="10" y="5" width="1" height="1" fill="#111111"/>
  <rect x="8" y="5" width="1" height="1" fill="#FF2222"/>
  <rect x="10" y="5" width="1" height="1" fill="#FF2222"/>
  <!-- Carrot nose -->
  <rect x="11" y="5" width="2" height="1" fill="#FF8833"/>
  <rect x="13" y="5" width="1" height="1" fill="#FF6611"/>
  <!-- Grin -->
  <rect x="7" y="6" width="4" height="1" fill="#222"/>
  <!-- Body -->
  <rect x="4" y="7" width="8" height="4" fill="#F0F0FF"/>
  <rect x="5" y="7" width="6" height="4" fill="#FFFFFF"/>
  <!-- Buttons -->
  <rect x="8" y="8" width="1" height="1" fill="#111111"/>
  <rect x="8" y="9" width="1" height="1" fill="#111111"/>
  <!-- Stick arms (one raised menacingly) -->
  <rect x="2" y="7" width="2" height="1" fill="#5C3A1E"/>
  <rect x="1" y="6" width="1" height="1" fill="#5C3A1E"/>
  <rect x="12" y="8" width="2" height="1" fill="#5C3A1E"/>
  <rect x="14" y="9" width="1" height="1" fill="#5C3A1E"/>
  <!-- Scarf -->
  <rect x="4" y="7" width="8" height="1" fill="#CC2222"/>
  <rect x="3" y="8" width="1" height="2" fill="#CC2222"/>
  <!-- Base (tilted, smaller since bouncing) -->
  <rect x="5" y="11" width="7" height="2" fill="#E8E8F0"/>
  <rect x="6" y="11" width="5" height="2" fill="#F0F0FF"/>
  <!-- Snow particles from movement -->
  <rect x="3" y="12" width="1" height="1" fill="#FFFFFF"/>
  <rect x="13" y="11" width="1" height="1" fill="#FFFFFF"/>
  <!-- Shadow -->
  <rect x="4" y="13" width="9" height="1" fill="#CCCCDD"/>
</svg>
