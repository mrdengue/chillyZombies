* { margin: 0; padding: 0; box-sizing: border-box; }
body {

h1 {

  margin-bottom: 20px;

.filters button {
  background: #fff;
  color: #445;

  padding: 6px 14px;
  margin: 3px;

  border-radius: 4px;

}

}
.category-header {
  background: #d0dae4;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.category-header h2 {
  color: #2a4a6a;
  font-size: 16px;
}
.badge {
  background: #b0c4d8;
  color: #445;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
}
.badge.original { background: #a8d5ba; color: #1a5c32; }
.badge.new { background: #f0d8a8; color: #7a5a20; }
.sprite-row {
  padding: 8px 12px;
  border-top: 1px solid #c0cdd8;
}
.sprite-row-label {
  font-size: 13px;
  margin-bottom: 6px;
}
.sprite-row-label.original { color: #1a7a3a; }
.sprite-row-label.svg { color: #8a6a10; }
.sprite-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  background: #ffffff;
  padding: 12px;
  border-radius: 4px;
}
.sprite-card {
  background: #f4f8fc;
  border: 1px solid #d0dae4;
  border-radius: 6px;
  padding: 8px;
  text-align: center;
  min-width: 90px;
}
.sprite-card img {
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  display: block;
  margin: 0 auto 6px;
  background: #ffffff;
  min-height: 32px;
}
.sprite-card .name {
  font-size: 10px;
  color: #667;
  word-break: break-all;
}
.sprite-card .dims {
  font-size: 9px;
  color: #999;
  margin-top: 2px;
}
.legend {
  text-align: center;
  margin-bottom: 16px;
  font-size: 12px;
  color: #667;
}
.legend span { margin: 0 10px; }
.legend .orig { color: #1a7a3a; }
.legend .svg-label { color: #8a6a10; }

function createSpriteCard(file) {
  var card = document.createElement('div');
  card.className = 'sprite-card';

  var img = document.createElement('img');
  img.src = file;
  img.alt = file;
  img.onerror = function() { this.style.border = '1px dashed red'; };
  card.appendChild(img);

  var nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = file.replace('anim_','').replace('.gif','');
  card.appendChild(nameEl);

  var dimsEl = document.createElement('div');
  dimsEl.className = 'dims';
  dimsEl.textContent = '...';
  card.appendChild(dimsEl);

  img.onload = function() {
    dimsEl.textContent = this.naturalWidth + 'x' + this.naturalHeight;
  };

  return card;
}

function createCategorySection(catKey, cat) {
  var section = document.createElement('div');
  section.className = 'category';
  section.setAttribute('data-cat', catKey);

  var header = document.createElement('div');
  header.className = 'category-header';

  var h2 = document.createElement('h2');
  h2.textContent = cat.label;
  header.appendChild(h2);

  var badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = cat.items.length + ' types';
  header.appendChild(badge);

  section.appendChild(header);

  cat.items.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'sprite-row';

    var label = document.createElement('div');
    label.className = 'sprite-row-label ' + (item.svg ? 'svg' : 'original');
    label.textContent = item.name + (item.svg ? ' (SVG Generated)' : ' (Original 2010)');
    row.appendChild(label);

    var grid = document.createElement('div');
    grid.className = 'sprite-grid';

    item.files.forEach(function(file) {
      grid.appendChild(createSpriteCard(file));
    });

    row.appendChild(grid);
    section.appendChild(row);
  });

  return section;
}

function render(filter) {
  var gallery = document.getElementById('gallery');
  gallery.textContent = '';

  Object.keys(sprites).forEach(function(catKey) {
    if (filter && filter !== catKey) return;
    gallery.appendChild(createCategorySection(catKey, sprites[catKey]));
  });
}

function filterAll(btn) {
  document.querySelectorAll('.filters button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render(null);
}

function filterCat(btn, cat) {
  document.querySelectorAll('.filters button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render(cat);
}
